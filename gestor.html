<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Minha Conta - Painel de Gestão</title>
    
    <!-- Configuração Central e Segurança -->
        <script>
        // CONFIGURAÇÃO CENTRAL EMBUTIDA (Garante funcionamento mesmo sem config.js externo)
        window.MC_CONFIG = window.MC_CONFIG || (function () {
            const hostname = window.location.hostname;
            const isLocalhost = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '';
            const API_BASE_URL = isLocalhost ? 'http://127.0.0.1:5000' : 'https://motor-openfinance.onrender.com';
            const TOKEN_KEY = 'mc_gestor_auth_token';
            const USER_KEY = 'mc_gestor_user_info';

            function getAuthToken() {
                return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY);
            }
            function setAuthToken(token, user, remember = true) {
                const storage = remember ? localStorage : sessionStorage;
                storage.setItem(TOKEN_KEY, token);
                if (user) storage.setItem(USER_KEY, JSON.stringify(user));
            }
            function clearAuthToken() {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(USER_KEY);
                sessionStorage.removeItem(TOKEN_KEY);
                sessionStorage.removeItem(USER_KEY);
            }
            function getAuthUser() {
                try {
                    const data = localStorage.getItem(USER_KEY) || sessionStorage.getItem(USER_KEY);
                    return data ? JSON.parse(data) : null;
                } catch (e) { return null; }
            }
            function isAuthenticated() {
                return !!getAuthToken();
            }
            async function authFetch(endpoint, options = {}) {
                const url = endpoint.startsWith('http') ? endpoint : `${API_BASE_URL}${endpoint}`;
                options.headers = options.headers || {};
                const token = getAuthToken();
                if (token) options.headers['Authorization'] = `Bearer ${token}`;
                if (!options.headers['Content-Type'] && !(options.body instanceof FormData)) {
                    options.headers['Content-Type'] = 'application/json';
                }
                const response = await fetch(url, options);
                if (response.status === 401) {
                    clearAuthToken();
                    if (!window.location.pathname.endsWith('gestor-login.html')) {
                        showToast('Sessão expirada. Faça login novamente.', 'warning');
                        setTimeout(() => { window.location.href = 'gestor-login.html'; }, 1200);
                    }
                }
                return response;
            }
            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function showToast(message, type = 'info', duration = 3500) {
                let container = document.getElementById('mc-toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'mc-toast-container';
                    container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:90vw;width:380px;';
                    document.body.appendChild(container);
                }
                const toast = document.createElement('div');
                toast.style.cssText = 'pointer-events:auto;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;font-family:sans-serif;font-size:13.5px;font-weight:500;color:#fff;box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);transition:all 0.3s ease;transform:translateX(100%);opacity:0;backdrop-filter:blur(8px);';
                let bgColor = '#1e293b';
                let icon = '<i class="fa-solid fa-circle-info text-sky-400"></i>';
                if (type === 'success') { bgColor = 'rgba(6, 78, 59, 0.95)'; icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>'; }
                else if (type === 'error') { bgColor = 'rgba(127, 29, 29, 0.95)'; icon = '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>'; }
                else if (type === 'warning') { bgColor = 'rgba(120, 53, 15, 0.95)'; icon = '<i class="fa-solid fa-circle-exclamation text-amber-400"></i>'; }
                toast.style.backgroundColor = bgColor;
                toast.innerHTML = `<div style="flex-shrink:0;">${icon}</div><div style="flex:1;">${escapeHtml(message)}</div><button style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px;" onclick="this.parentElement.remove()">&times;</button>`;
                container.appendChild(toast);
                requestAnimationFrame(() => { toast.style.transform = 'translateX(0)'; toast.style.opacity = '1'; });
                setTimeout(() => { toast.style.transform = 'translateX(100%)'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 350); }, duration);
            }
            function formatMoney(value) {
                if (value === null || value === undefined || isNaN(value)) return 'R$ 0,00';
                return parseFloat(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }
            function formatDate(dateString) {
                if (!dateString) return '---';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) return dateString;
                    return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                } catch (e) { return dateString; }
            }
            return { API_BASE_URL, isLocalhost, getAuthToken, setAuthToken, clearAuthToken, getAuthUser, isAuthenticated, authFetch, escapeHtml, showToast, formatMoney, formatDate };
        })();
    </script>

    <!-- TRAVA DE SEGURANÇA: Bloqueia não autenticados imediatamente -->
    <script>
        if (!MC_CONFIG.isAuthenticated()) {
            window.location.href = "gestor-login.html";
        }
    </script>

        <!-- GRID PRINCIPAL -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- COLUNA ESQUERDA: GERADOR DE ACESSO -->
            <div class="lg:col-span-4 bg-white rounded-3xl border border-slate-200/80 p-6 md:p-8 shadow-sm">
                <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#0985ff] flex items-center justify-center text-lg">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-[#010157]">Gerar Novo Acesso</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Envie o link seguro para o WhatsApp do cliente.</p>
                    </div>
                </div>

                <!-- ABAS DO GERADOR -->
                <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                    <button 
                        type="button"
                        onclick="mudarAbaGerador('extrato')" 
                        id="aba-gen-extrato" 
                        class="flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-[#010157] text-white shadow-sm cursor-pointer"
                    >
                        Open Finance (Extrato)
                    </button>
                    <button 
                        type="button"
                        onclick="mudarAbaGerador('pix')" 
                        id="aba-gen-pix" 
                        class="flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-[#010157] cursor-pointer"
                    >
                        Pix Automático
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-[#010157] uppercase tracking-wider mb-2">Identificador ou Nome do Cliente</label>
                        <input 
                            type="text" 
                            id="identificadorCliente" 
                            placeholder="Ex: JoaoSilva ou Contrato482" 
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition"
                        >
                    </div>

                    <!-- CAMPOS EXCLUSIVOS DO PIX AUTOMÁTICO -->
                    <div id="campos-pix" class="hidden space-y-4 pt-2 border-t border-slate-100">
                        <div>
                            <label class="block text-xs font-bold text-[#010157] uppercase tracking-wider mb-2">Instituição Financeira</label>
                            <div class="space-y-1.5">
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        id="buscaBancoPix" 
                                        oninput="filtrarOpcoesBancos()" 
                                        placeholder="Buscar por número (ex: 001, 237, 341) ou nome..." 
                                        class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition"
                                    >
                                </div>
                                <select id="bancoPix" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition cursor-pointer font-medium">
                                    <option value="">Carregando bancos autorizados...</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#010157] uppercase tracking-wider mb-2">CPF do Titular (Apenas dígitos)</label>
                            <input 
                                type="text" 
                                id="cpfCliente" 
                                placeholder="000.000.000-00" 
                                maxlength="14" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition"
                            >
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#010157] uppercase tracking-wider mb-2">Valor Mensal Recorrente (R$)</label>
                            <input 
                                type="number" 
                                id="valorPix" 
                                placeholder="Ex: 150.00" 
                                step="0.01" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition"
                            >
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-bold text-[#010157] uppercase tracking-wider mb-1.5">Data Início</label>
                                <input type="date" id="dataInicio" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-[#010157] uppercase tracking-wider mb-1.5">Data Término</label>
                                <input type="date" id="dataFim" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition">
                            </div>
                        </div>
                    </div>

                    <button

                        <i class="fa-solid fa-bolt"></i> Gerar Link Seguro

                                id="btn-copiar"
                                onclick="copiarLink()" 
                                class="flex-1 bg-[#010157] hover:bg-[#080868] text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-xs cursor-pointer"
                            >
                                <i class="fa-regular fa-copy"></i> Copiar Link
                            </button>

                            <button 
                                type="button"
                                onclick="compartilharWhatsApp()" 
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-xs cursor-pointer"
                                title="Enviar no WhatsApp"
                            >
                                <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUNA DIREITA: HISTÓRICO DE CONEXÕES DOS CLIENTES -->
            <div class="lg:col-span-8 bg-white rounded-3xl border border-slate-200/80 p-6 md:p-8 shadow-sm flex flex-col min-h-[640px]">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#0985ff] flex items-center justify-center text-lg">
                            <i class="fa-solid fa-users-viewfinder"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-[#010157]">Clientes Conectados</h2>
                            <p class="text-xs text-slate-500 mt-0.5">Acompanhe extratos de Open Finance e contratos de Pix Automático.</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <div class="relative flex-1 md:w-64">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                <i class="fa-solid fa-magnifying-glass text-xs"></i>
                            </div>
                            <input 
                                type="text" 
                                id="inputBusca" 
                                onkeyup="filtrarClientes()" 
                                placeholder="Buscar cliente..." 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0985ff]/30 focus:border-[#0985ff] transition"
                            >
                        </div>

                        <button 
                            type="button"
                            onclick="carregarClientes()" 
                            id="btn-recarregar"
                            class="bg-slate-100 hover:bg-slate-200 text-[#010157] px-3.5 py-2 rounded-xl text-xs font-bold transition border border-slate-200 flex items-center gap-2 cursor-pointer"
                            title="Atualizar lista"
                        >
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                </div>

                <!-- ABAS DE FILTRO EXCLUSIVAS: APENAS OPEN FINANCE E PIX AUTOMÁTICO (SEM ABA TODOS) -->
                <div class="flex bg-slate-100 p-1.5 rounded-2xl w-fit mb-6 border border-slate-200/80 gap-1.5">
                    <button type="button" onclick="mudarAbaLista('extrato')" id="aba-lista-extrato" class="px-5 py-2 rounded-xl text-xs font-bold transition bg-[#010157] text-white shadow-sm flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-building-columns text-[#0985ff]"></i> Open Finance
                    </button>
                    <button type="button" onclick="mudarAbaLista('pix')" id="aba-lista-pix" class="px-5 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-[#010157] flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-repeat text-emerald-500"></i> Pix Automático
                    </button>
                </div>
                
                <!-- LISTA DE CLIENTES -->
                <div id="lista-clientes" class="space-y-4 overflow-y-auto pr-1 custom-scrollbar flex-1 max-h-[620px]">
                    <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                        <i class="fa-solid fa-circle-notch fa-spin text-[#0985ff] text-3xl mb-3"></i>
                        <p class="text-xs">Carregando registros de conexões...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let todosOsClientes = []; 
        let tipoLinkAtivo = 'extrato';
        let listaTodosBancos = [];

        function fazerLogout() {
            if (confirm("Deseja realmente sair do Portal do Gestor?")) {
                MC_CONFIG.clearAuthToken();
                window.location.href = "gestor-login.html";
            }
        }

        async function carregarBancos() {
            const selectBanco = document.getElementById('bancoPix');
            try {
                const resposta = await fetch(`${MC_CONFIG.API_BASE_URL}/listar-bancos`);
                if (!resposta.ok) throw new Error('Falha ao buscar instituições');
                listaTodosBancos = await resposta.json();
                renderizarOpcoesBancos(listaTodosBancos);
            } catch (erro) {
                selectBanco.innerHTML = '<option value="">Erro ao carregar lista de bancos</option>';
            }
        }

        function renderizarOpcoesBancos(bancos) {
            const selectBanco = document.getElementById('bancoPix');
            selectBanco.innerHTML = '<option value="">Selecione o banco (com número COMPE)...</option>';
            bancos.forEach(banco => {
                selectBanco.innerHTML += `<option value="${banco.id}">${MC_CONFIG.escapeHtml(banco.name)}</option>`;
            });
        }

        function filtrarOpcoesBancos() {
            const termo = (document.getElementById('buscaBancoPix')?.value || '').toLowerCase().trim();
            const bancosFiltrados = listaTodosBancos.filter(b => {
                const nomeMatch = (b.name || '').toLowerCase().includes(termo);
                const codeMatch = (b.code || '').includes(termo);
                return nomeMatch || codeMatch;
            });
            renderizarOpcoesBancos(bancosFiltrados);
        }

        function mudarAbaGerador(aba) {
            tipoLinkAtivo = aba;
            const btnExtrato = document.getElementById('aba-gen-extrato');
            const btnPix = document.getElementById('aba-gen-pix');
            const camposPix = document.getElementById('campos-pix');
            const boxResultado = document.getElementById('box-resultado');

            btnExtrato.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-[#010157] cursor-pointer";
            btnPix.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-[#010157] cursor-pointer";
            boxResultado.classList.add("hidden");

            if (aba === 'extrato') {
                btnExtrato.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-[#010157] text-white shadow-sm cursor-pointer";
                camposPix.classList.add('hidden');
            } else {
                btnPix.className = "flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-[#010157] text-white shadow-sm cursor-pointer";
                camposPix.classList.remove('hidden');
            }
        }

        function gerarLink() {
            const identificador = document.getElementById("identificadorCliente").value.trim();
            if (!identificador) {
                MC_CONFIG.showToast("Informe o identificador do cliente.", "warning");
                return;
            }

            const idFormatado = identificador.replace(/[^a-zA-Z0-9_-]/g, "-").toLowerCase();
            const parametros = new URLSearchParams({ cliente: idFormatado });

            if (tipoLinkAtivo === 'pix') {
                const banco = document.getElementById("bancoPix").value;
                const cpf = document.getElementById("cpfCliente").value.replace(/\D/g, '');
                const valor = document.getElementById("valorPix").value.trim();
                const dataInicio = document.getElementById("dataInicio").value;
                const dataFim = document.getElementById("dataFim").value;

                if (!banco || !cpf || !valor || !dataInicio) {
                    MC_CONFIG.showToast("Preencha todos os campos obrigatórios do Pix Automático.", "warning");
                    return;
                }
                
                parametros.append('banco', banco);
                parametros.append('cpf', cpf);
                parametros.append('valor', valor);
                parametros.append('inicio', dataInicio);
                if (dataFim) parametros.append('fim', dataFim);
            }

            // Garante que o link gerado use o domínio público oficial da vitrine na nuvem
            // para que qualquer cliente consiga abrir no celular ou em outro computador
            let urlBase = window.location.origin;
            if (!urlBase || urlBase === 'null' || urlBase.startsWith('file:') || urlBase.includes('localhost') || urlBase.includes('127.0.0.1')) {
                urlBase = 'https://vitrine-openfinance.onrender.com';
            }
            const urlFinal = `${urlBase}/cliente.html?${parametros.toString()}`;
            
            document.getElementById("linkGerado").textContent = urlFinal;
            document.getElementById("box-resultado").classList.remove("hidden");
            MC_CONFIG.showToast("Link gerado com sucesso!", "success");
        }

        function copiarLink() {
            const texto = document.getElementById("linkGerado").textContent;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.getElementById("btn-copiar");
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copiado!`;
                MC_CONFIG.showToast("Link seguro copiado para a área de transferência!", "success");
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copiar Link`;
                }, 2000);
            }).catch(() => {
                MC_CONFIG.showToast("Erro ao copiar o link.", "error");
            });
        }

        function compartilharWhatsApp() {
            const texto = document.getElementById("linkGerado").textContent;
            const cliente = document.getElementById("identificadorCliente").value.trim();
            const mensagem = `Olá ${cliente}, segue o link seguro da MC Minha Conta para autorização bancária: ${texto}`;
            const urlWhats = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhats, '_blank');
        }

        async function carregarClientes() {
            const divLista = document.getElementById('lista-clientes');
            const btnRecarregar = document.getElementById('btn-recarregar');
            
            btnRecarregar.innerHTML = `<i class="fa-solid fa-rotate fa-spin"></i>`;
            divLista.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-[#0985ff] text-3xl mb-3"></i>
                    <p class="text-xs">Consultando banco de conexões...</p>
                </div>
            `;
            
            try {
                const resposta = await MC_CONFIG.authFetch('/listar-conexoes');
                if (!resposta.ok) throw new Error('Falha ao consultar as conexões');
                
                todosOsClientes = await resposta.json();
                
                // Determina aba ativa (padrão é extrato / Open Finance)
                const btnPix = document.getElementById('aba-lista-pix');
                const abaAtual = (btnPix && btnPix.classList.contains('bg-[#010157]')) ? 'pix' : 'extrato';
                renderizarLista(abaAtual);
            } catch (erro) {
                divLista.innerHTML = `
                    <div class="text-center py-12 text-rose-500 text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>Falha ao carregar conexões de clientes: ${MC_CONFIG.escapeHtml(erro.message)}</p>
                    </div>
                `;
            } finally {
                btnRecarregar.innerHTML = `<i class="fa-solid fa-rotate"></i>`;
            }
        }

        function mudarAbaLista(abaSelecionada) {
            const btnExtrato = document.getElementById('aba-lista-extrato');
            const btnPix = document.getElementById('aba-lista-pix');
            
            btnExtrato.className = "px-5 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-[#010157] flex items-center gap-2 cursor-pointer";
            btnPix.className = "px-5 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-[#010157] flex items-center gap-2 cursor-pointer";
            
            if (abaSelecionada === 'extrato') {
                btnExtrato.className = "px-5 py-2 rounded-xl text-xs font-bold transition bg-[#010157] text-white shadow-sm flex items-center gap-2 cursor-pointer";
            } else {
                btnPix.className = "px-5 py-2 rounded-xl text-xs font-bold transition bg-[#010157] text-white shadow-sm flex items-center gap-2 cursor-pointer";
            }
            
            renderizarLista(abaSelecionada);
        }

        function filtrarClientes() {
            const btnPix = document.getElementById('aba-lista-pix');
            const abaAtiva = (btnPix && btnPix.classList.contains('bg-[#010157]')) ? 'pix' : 'extrato';
            renderizarLista(abaAtiva);
        }

        function renderizarLista(filtroAba) {
            const divLista = document.getElementById('lista-clientes');
            const termoBusca = document.getElementById('inputBusca').value.toLowerCase().trim();
            
            let clientesFiltrados = todosOsClientes.filter(cliente => {
                const nomeMatch = (cliente.cliente || '').toLowerCase().includes(termoBusca);
                let abaMatch = false;
                if (filtroAba === 'extrato') {
                    // Open Finance ESTRITO: NÃO pode ter payment_intent_id
                    abaMatch = (cliente.tipo === 'open_finance') || (!cliente.payment_intent_id && Boolean(cliente.item_id));
                } else if (filtroAba === 'pix') {
                    // Pix Automático ESTRITO: DEVE ter payment_intent_id
                    abaMatch = (cliente.tipo === 'pix_automatico') || Boolean(cliente.payment_intent_id);
                }
                return nomeMatch && abaMatch;
            });

            if (clientesFiltrados.length === 0) {
                const tipoTexto = filtroAba === 'extrato' ? 'Open Finance' : 'Pix Automático';
                divLista.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-solid fa-inbox text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs">Nenhum registro de <strong>${tipoTexto}</strong> encontrado.</p>
                    </div>
                `;
                return;
            }
            
            divLista.innerHTML = ''; 
            clientesFiltrados.forEach(cliente => {
                const dataFormatada = MC_CONFIG.formatDate(cliente.data_conexao);
                const nomeSeguro = MC_CONFIG.escapeHtml(cliente.cliente);
                const clienteId = cliente.id || Math.random().toString(36).substring(7);

                let btnAcao = '';
                let badgeTipo = '';
                
                if (cliente.payment_intent_id || cliente.tipo === 'pix_automatico') {
                    badgeTipo = `<span class="px-2.5 py-0.5 bg-emerald-50 text-emerald-700 text-[10px] uppercase font-bold rounded-md border border-emerald-200">Pix Automático</span>`;
                    const pixId = cliente.payment_intent_id || cliente.item_id;
                    btnAcao = `
                        <button onclick="consultarPix('${MC_CONFIG.escapeHtml(pixId)}', 'detalhe-${clienteId}', '${nomeSeguro}')" class="bg-white hover:bg-slate-50 text-[#010157] border border-slate-300 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 w-full md:w-auto shadow-sm cursor-pointer">
                            <i class="fa-solid fa-file-invoice-dollar text-[#0985ff]"></i> Extrato de Cobrança Pix
                        </button>
                    `;
                } else {
                    badgeTipo = `<span class="px-2.5 py-0.5 bg-blue-50 text-[#0985ff] text-[10px] uppercase font-bold rounded-md border border-blue-200">Open Finance</span>`;
                    btnAcao = `
                        <button onclick="buscarExtratos('${MC_CONFIG.escapeHtml(cliente.item_id)}', 'detalhe-${clienteId}', '${nomeSeguro}')" class="btn-brand-primary text-white px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 w-full md:w-auto cursor-pointer">
                            <i class="fa-solid fa-magnifying-glass-chart"></i> Consultar Extrato
                        </button>
                    `;
                }

                divLista.innerHTML += `
                    <div class="bg-white border border-slate-200/90 rounded-2xl p-5 hover:border-[#0985ff]/50 transition duration-200 shadow-sm">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-[#010157] text-sm">#${nomeSeguro}</h3>
                                    ${badgeTipo}
                                </div>
                                <p class="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
                                    <i class="fa-regular fa-clock"></i> Conectado em: ${dataFormatada}
                                </p>
                            </div>
                            ${btnAcao}
                        </div>
                        <div id="detalhe-${clienteId}" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-5 mt-4"></div>
                    </div>
                `;
            });
        }

        async function buscarExtratos(itemId, divId, nomeCliente) {
            const areaDetalhe = document.getElementById(divId);
            if (!areaDetalhe.classList.contains('hidden')) {
                areaDetalhe.classList.add('hidden');
                return;
            }

            areaDetalhe.classList.remove('hidden');
            areaDetalhe.innerHTML = `
                <div class="flex items-center justify-center py-8 text-[#0985ff] text-xs gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                    Buscando contas bancárias e saldos atualizados na Pluggy...
                </div>
            `;

            try {
                const resposta = await MC_CONFIG.authFetch(`/consultar-dados/${itemId}`);
                if (!resposta.ok) throw new Error('Falha ao comunicar com a Pluggy');
                
                const dados = await resposta.json();
                const item = dados.item || {};
                const contas = dados.results || [];
                const bancoNome = MC_CONFIG.escapeHtml(item.connector?.name || 'Instituição Bancária');

                // CASO 1: Item com erro de login ou permissão revogada (ex: Bradesco LOGIN_ERROR)
                if (item.status === 'LOGIN_ERROR' || (contas.length === 0 && item.error)) {
                    const motivo = item.error?.providerMessage || item.error?.message || 'A autorização expirou ou foi revogada no aplicativo do banco.';
                    areaDetalhe.innerHTML = `
                        <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-5 text-amber-900">
                            <div class="flex items-start gap-3">
                                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg flex-shrink-0">
                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <div class="flex-1">
                                    <h4 class="font-bold text-sm text-[#010157]">Autorização Expirada ou Revogada no Banco</h4>
                                    <p class="text-xs text-slate-600 mt-1">
                                        Banco: <strong>${bancoNome}</strong>. Motivo: ${MC_CONFIG.escapeHtml(motivo)}
                                    </p>
                                    <p class="text-[11px] text-slate-500 mt-2">
                                        O cliente precisa realizar uma nova autorização rápida para que os extratos voltem a sincronizar.
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }

                // CASO 2: Nenhuma conta encontrada
                if (contas.length === 0) {
                    areaDetalhe.innerHTML = `
                        <div class="text-center py-6 text-slate-500 text-xs">
                            <i class="fa-solid fa-building-columns text-2xl text-slate-300 mb-2"></i>
                            <p>Nenhuma conta corrente ou poupança ativa encontrada para este cliente no banco <strong>${bancoNome}</strong>.</p>
                        </div>
                    `;
                    return;
                }

                // CASO 3: Contas encontradas (ex: Gabriel Santander, Maria José Bradesco, Juliane InfinitePay)
                let htmlContas = `
                    <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-200">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-building-columns text-[#0985ff]"></i>
                            <h4 class="font-bold text-[#010157] text-sm">${bancoNome}</h4>
                        </div>
                        <span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full flex items-center gap-1">
                            <i class="fa-solid fa-circle text-[6px]"></i> Conexão Ativa
                        </span>
                    </div>
                `;

                contas.forEach(conta => {
                    const saldoFormatado = MC_CONFIG.formatMoney(conta.balance);
                    const nomeConta = MC_CONFIG.escapeHtml(conta.name || 'Conta Bancária');
                    const subtipo = MC_CONFIG.escapeHtml(conta.subtype || 'Corrente');
                    const agencia = MC_CONFIG.escapeHtml(conta.agency || '---');
                    const numero = MC_CONFIG.escapeHtml(conta.number || '---');

                    htmlContas += `
                        <div class="border-b border-slate-200 pb-5 mb-5 last:border-0 last:pb-0 last:mb-0">
                            <div class="flex justify-between items-center mb-2">
                                <div>
                                    <h4 class="font-bold text-[#010157] text-sm">${nomeConta}</h4>
                                    <div class="text-[11px] text-slate-500 mt-0.5">
                                        Agência: ${agencia} | Conta: ${numero} | ${subtipo}
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] text-slate-400 uppercase font-bold block mb-0.5">Saldo Disponível</span>
                                    <span class="text-[#0985ff] font-extrabold text-base">${saldoFormatado}</span>
                                </div>
                            </div>

                            <div id="transacoes-${conta.id}" class="bg-white p-4 rounded-xl border border-slate-200 mt-3 shadow-sm">
                                <div class="flex items-center justify-center py-4 text-xs text-slate-400 gap-2">
                                    <i class="fa-solid fa-circle-notch fa-spin text-[#0985ff]"></i>
                                    Carregando histórico de transações...
                                </div>
                            </div>
                        </div>
                    `;
                });

                areaDetalhe.innerHTML = htmlContas;

                contas.forEach(conta => {
                    buscarMovimentacoes(conta.id);
                });

            } catch (erro) {
                areaDetalhe.innerHTML = `
                    <div class="text-center py-4 text-rose-500 text-xs">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Erro ao carregar extrato: ${MC_CONFIG.escapeHtml(erro.message)}
                    </div>
                `;
            }
        }

        async function buscarMovimentacoes(accountId) {
            const areaTransacoes = document.getElementById(`transacoes-${accountId}`);
            try {
                const resposta = await MC_CONFIG.authFetch(`/consultar-transacoes/${accountId}`);
                const payload = await resposta.json();
                
                if (!resposta.ok) {
                    throw new Error(payload.erro || 'Falha ao buscar movimentações');
                }
                
                const transacoesData = payload.results || payload.data || []; 
                
                if (transacoesData.length === 0) {
                    areaTransacoes.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Sem movimentações recentes no período.</p>';
                    return;
                }

                let htmlTx = `
                    <div class="flex justify-between items-center mb-3">
                        <strong class="text-[11px] font-bold text-[#010157] uppercase tracking-wider">Histórico Recente</strong>
                        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">${transacoesData.length} registros</span>
                    </div>
                    <div class="space-y-1.5 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                `;
                
                transacoesData.forEach(tx => {
                    if (tx.amount == null) return; 

                    const valorForm = MC_CONFIG.formatMoney(Math.abs(tx.amount));
                    const isNegativo = tx.amount < 0;
                    const cor = isNegativo ? 'text-slate-800' : 'text-[#0985ff] font-semibold';
                    const sinal = isNegativo ? '-' : '+';
                    const dataBR = tx.date ? new Date(tx.date).toLocaleDateString('pt-BR') : '---';
                    const descSegura = MC_CONFIG.escapeHtml(tx.description || 'Transação');

                    htmlTx += `
                        <div class="flex justify-between items-center text-xs py-2 px-2.5 hover:bg-slate-50 transition rounded-lg border-b border-slate-100 last:border-0">
                            <span class="text-slate-700 truncate max-w-[220px] md:max-w-md">
                                <span class="text-slate-400 font-mono text-[11px] mr-2">${dataBR}</span> 
                                ${descSegura}
                            </span>
                            <span class="${cor} font-mono text-xs whitespace-nowrap">${sinal} ${valorForm}</span>
                        </div>
                    `;
                });
                
                htmlTx += '</div>';
                areaTransacoes.innerHTML = htmlTx;
                
            } catch (erro) {
                areaTransacoes.innerHTML = `<p class="text-xs text-rose-500 text-center py-2">Falha nas transações: ${MC_CONFIG.escapeHtml(erro.message)}</p>`;
            }
        }

        async function consultarPix(intentId, divId, nomeCliente) {
            const areaDetalhe = document.getElementById(divId);
            if (!areaDetalhe.classList.contains('hidden')) {
                areaDetalhe.classList.add('hidden');
                return;
            }

            areaDetalhe.classList.remove('hidden');
            areaDetalhe.innerHTML = `
                <div class="flex items-center justify-center py-8 text-emerald-600 text-xs gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                    Buscando extrato analítico do Pix Automático na Pluggy...
                </div>
            `;

            try {
                const resposta = await MC_CONFIG.authFetch(`/consultar-pix/${intentId}`);
                if (!resposta.ok) throw new Error('Falha ao consultar contrato Pix');
                
                const pix = await resposta.json();
                
                let badgeClass = 'bg-slate-100 text-slate-700 border-slate-200';
                let iconStatus = '<i class="fa-solid fa-clock text-slate-400"></i>';
                if (pix.status_classe === 'ativo') {
                    badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                    iconStatus = '<i class="fa-solid fa-circle-check text-emerald-600"></i>';
                } else if (pix.status_classe === 'rejeitado') {
                    badgeClass = 'bg-rose-100 text-rose-800 border-rose-300';
                    iconStatus = '<i class="fa-solid fa-circle-xmark text-rose-600"></i>';
                } else if (pix.status_classe === 'pendente') {
                    badgeClass = 'bg-amber-100 text-amber-800 border-amber-300';
                    iconStatus = '<i class="fa-solid fa-hourglass-half text-amber-600"></i>';
                }

                const valorFormatado = MC_CONFIG.formatMoney(pix.valor_parcela);
                const totalPagoForm = MC_CONFIG.formatMoney(pix.total_pago);
                const totalRestanteForm = MC_CONFIG.formatMoney(pix.total_restante);
                const percentualQuitado = pix.parcelas_total > 0 ? Math.round((pix.parcelas_pagas / pix.parcelas_total) * 100) : 0;
                const bancoNome = MC_CONFIG.escapeHtml(pix.banco_nome || 'Banco');

                // Linhas da tabela de parcelas
                let linhasCronograma = '';
                (pix.cronograma || []).forEach(p => {
                    let badgeParc = '';
                    if (p.status === 'paga') {
                        badgeParc = '<span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[11px] border border-emerald-200 flex items-center gap-1 w-fit"><i class="fa-solid fa-check"></i> Paga</span>';
                    } else if (p.status === 'proximo_debito') {
                        badgeParc = '<span class="bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded text-[11px] border border-sky-200 flex items-center gap-1 w-fit"><i class="fa-solid fa-calendar-day"></i> Próximo Débito</span>';
                    } else if (p.status === 'rejeitada') {
                        badgeParc = '<span class="bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded text-[11px] border border-rose-200 flex items-center gap-1 w-fit"><i class="fa-solid fa-xmark"></i> Não Autorizada</span>';
                    } else {
                        badgeParc = '<span class="bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded text-[11px] border border-slate-200 flex items-center gap-1 w-fit"><i class="fa-regular fa-clock"></i> A Vencer</span>';
                    }

                    linhasCronograma += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition text-xs">
                            <td class="py-2.5 px-3 font-semibold text-[#010157]">Parcela ${p.numero} / ${pix.parcelas_total}</td>
                            <td class="py-2.5 px-3 text-slate-600 font-mono">${p.vencimento}</td>
                            <td class="py-2.5 px-3 font-bold text-slate-800 font-mono">${MC_CONFIG.formatMoney(p.valor)}</td>
                            <td class="py-2.5 px-3">${badgeParc}</td>
                        </tr>
                    `;
                });

                areaDetalhe.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 md:p-6 border border-slate-200 shadow-sm space-y-6">
                        <!-- HEADER DO EXTRATO PIX -->
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-hand-holding-dollar"></i>
                                </div>
                                <div>
                                    <h4 class="text-[#010157] font-bold text-sm">Extrato de Pagamentos - Pix Automático</h4>
                                    <p class="text-xs text-slate-500">Banco: <strong>${bancoNome}</strong> | Início: ${pix.data_inicio || '---'}</p>
                                </div>
                            </div>
                            <span class="font-bold text-xs px-3 py-1 rounded-full border ${badgeClass} flex items-center gap-1.5 shadow-sm">
                                ${iconStatus} ${pix.status_rotulo}
                            </span>
                        </div>

                        <!-- 4 CARDS DE RESUMO ANALÍTICO -->
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Parcelas Pagas</span>
                                <div class="text-base font-extrabold text-emerald-600 flex items-center gap-1.5">
                                    <i class="fa-solid fa-circle-check text-xs"></i> ${pix.parcelas_pagas} de ${pix.parcelas_total}
                                </div>
                                <span class="text-[11px] text-slate-500 font-mono block mt-0.5">${totalPagoForm} pago</span>
                            </div>

                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Parcelas Restantes</span>
                                <div class="text-base font-extrabold text-[#010157] flex items-center gap-1.5">
                                    <i class="fa-solid fa-hourglass text-xs text-[#0985ff]"></i> ${pix.parcelas_restantes} de ${pix.parcelas_total}
                                </div>
                                <span class="text-[11px] text-slate-500 font-mono block mt-0.5">${totalRestanteForm} a vencer</span>
                            </div>

                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Valor da Parcela</span>
                                <div class="text-base font-extrabold text-[#0985ff] font-mono">
                                    ${valorFormatado}
                                </div>
                                <span class="text-[11px] text-slate-500 block mt-0.5">Mensal recorrente</span>
                            </div>

                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Próximo Vencimento</span>
                                <div class="text-base font-extrabold text-slate-800 font-mono flex items-center gap-1.5">
                                    <i class="fa-regular fa-calendar text-xs text-[#0985ff]"></i> ${pix.proximo_vencimento}
                                </div>
                                <span class="text-[11px] text-slate-500 block mt-0.5">Débito em conta</span>
                            </div>
                        </div>

                        <!-- BARRA DE PROGRESSO DE QUITAÇÃO -->
                        <div class="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <div class="flex justify-between text-xs">
                                <span class="font-bold text-[#010157]">Progresso de Pagamento do Contrato</span>
                                <span class="font-extrabold text-emerald-600">${percentualQuitado}% concluído</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2.5 rounded-full transition-all duration-500" style="width: ${percentualQuitado}%;"></div>
                            </div>
                        </div>

                        <!-- TABELA DE CRONOGRAMA DE 1 A 12 PARCELAS -->
                        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                            <div class="bg-slate-100/80 px-4 py-2.5 border-b border-slate-200 flex justify-between items-center">
                                <span class="text-xs font-bold text-[#010157] uppercase tracking-wider">Cronograma de Parcelas do Contrato</span>
                                <span class="text-[11px] text-slate-500 font-semibold">${pix.parcelas_total} parcelas programadas</span>
                            </div>
                            <div class="overflow-x-auto max-h-64 overflow-y-auto custom-scrollbar">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 text-[11px] font-bold text-slate-500 uppercase border-b border-slate-200">
                                            <th class="py-2.5 px-3">Parcela</th>
                                            <th class="py-2.5 px-3">Vencimento</th>
                                            <th class="py-2.5 px-3">Valor</th>
                                            <th class="py-2.5 px-3">Status do Pagamento</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${linhasCronograma}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

            } catch (erro) {
                areaDetalhe.innerHTML = `<p class="text-xs text-rose-500 text-center py-4">Erro ao buscar extrato do Pix Automático: ${MC_CONFIG.escapeHtml(erro.message)}</p>`;
            }
        }

        window.onload = () => {
            const user = MC_CONFIG.getAuthUser();
            if (user && user.nome) {
                document.getElementById('nome-gestor-logado').textContent = user.nome;
            }
            carregarClientes();
            carregarBancos();
        };
    </script>
</body>
</html>
