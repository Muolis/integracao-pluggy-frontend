<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Minha Conta - Extrato Open Finance</title>
    
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f4f7fc] text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <div class="bg-white rounded-3xl border border-slate-200/80 p-6 md:p-8 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-white rounded-2xl p-1.5 shadow-sm border border-slate-100 flex items-center justify-center">
                    <img src="logo-mc-minhaconta.png" alt="MC Minha Conta" class="h-12 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold text-[#010157] tracking-tight">Painel de Extratos Bancários</h1>
                    <p id="info-cliente" class="text-xs text-slate-500 mt-0.5">Cliente: Carregando...</p>
                </div>
            </div>

            <a href="gestor.html" class="text-xs font-semibold text-[#0985ff] hover:text-[#0772dc] flex items-center gap-1.5 bg-blue-50/80 px-4 py-2.5 rounded-xl border border-blue-100 transition">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Gestor
            </a>
        </div>

        <div id="status-box" class="bg-blue-50 border border-blue-200 text-[#010157] text-xs font-semibold p-4 rounded-xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin text-[#0985ff]"></i> Buscando dados bancários seguros na Pluggy...
        </div>

        <div id="lista-contas" class="space-y-4"></div>
    </div>

    <script>
        const parametrosUrl = new URLSearchParams(window.location.search);
        const itemId = parametrosUrl.get('item');
        const clienteId = parametrosUrl.get('cliente');

        const statusBox = document.getElementById('status-box');
        const listaContas = document.getElementById('lista-contas');

        if (clienteId) {
            document.getElementById('info-cliente').innerText = `Atendimento: #${clienteId}`;
        }

        async function buscarDados() {
            if (!itemId) {
                mostrarErro("Nenhum código de conexão (Item ID) fornecido na URL.");
                return;
            }

            try {
                const resposta = await MC_CONFIG.authFetch(`/consultar-dados/${itemId}`);
                
                if (!resposta.ok) {
                    throw new Error('Falha ao consultar API bancária.');
                }

                const dados = await resposta.json();
                renderizarContas(dados);

            } catch (erro) {
                mostrarErro(erro.message || "Erro ao consultar contas bancárias.");
            }
        }

        function renderizarContas(dados) {
            statusBox.style.display = 'none'; 
            const contas = dados.results || [];

            if (contas.length === 0) {
                listaContas.innerHTML = `
                    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center text-xs text-slate-500">
                        Nenhuma conta bancária ativa encontrada para esta conexão.
                    </div>
                `;
                return;
            }

            listaContas.innerHTML = ''; 

            contas.forEach(conta => {
                const saldoFormatado = MC_CONFIG.formatMoney(conta.balance);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm flex justify-between items-center';
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-[#010157] text-sm mb-1">${MC_CONFIG.escapeHtml(conta.name || 'Conta Bancária')}</h3>
                        <p class="text-xs text-slate-500">Agência: ${MC_CONFIG.escapeHtml(conta.agency || '---')} | Conta: ${MC_CONFIG.escapeHtml(conta.number || '---')}</p>
                        <p class="text-[11px] text-[#0985ff] mt-1 uppercase font-semibold">${MC_CONFIG.escapeHtml(conta.subtype || 'Corrente')}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 uppercase font-bold block mb-0.5">Saldo Disponível</span>
                        <strong class="text-[#0985ff] font-extrabold text-xl">${saldoFormatado}</strong>
                    </div>
                `;
                listaContas.appendChild(card);
            });
        }

        function mostrarErro(mensagem) {
            statusBox.className = 'bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold p-4 rounded-xl flex items-center justify-center gap-2';
            statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${MC_CONFIG.escapeHtml(mensagem)}`;
        }

        buscarDados();
    </script>
</body>
</html>
