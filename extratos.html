<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Minha Conta - Extrato Open Finance</title>
    
    <!-- Configuração Central e Segurança -->
    <script src="config.js?v=20260925_v2"></script>
    
    <!-- Trava de Autenticação -->
    <script>
        if (!MC_CONFIG.isAuthenticated()) {
            window.location.href = "gestor-login.html";
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="bg-[#f4f7fc] text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- HEADER DO EXTRATO -->
        <header class="bg-white rounded-3xl border border-slate-200/80 p-6 md:p-8 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-white rounded-2xl p-1.5 shadow-sm border border-slate-100 flex items-center justify-center">
                    <img src="logo-mc-minhaconta.png" alt="MC Minha Conta" class="h-12 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold text-[#010157] tracking-tight">Extrato Bancário Detalhado</h1>
                    <p id="info-cliente" class="text-xs text-slate-500 mt-0.5">Cliente: Carregando identificador...</p>
                </div>
            </div>

            <a href="gestor.html" class="text-xs font-semibold text-[#0985ff] hover:text-[#0772dc] flex items-center gap-1.5 bg-blue-50/80 px-4 py-2.5 rounded-xl border border-blue-100 transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel do Gestor
            </a>
        </header>

        <!-- STATUS BOX -->
        <div id="status-box" class="bg-blue-50 border border-blue-200 text-[#010157] text-xs font-semibold p-4 rounded-xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin text-[#0985ff]"></i> Buscando dados bancários seguros e extratos na Pluggy...
        </div>

        <!-- RESUMO FINANCEIRO (Renderizado dinamicamente) -->
        <div id="cards-resumo" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4"></div>

        <!-- LISTA DE CONTAS E TRANSAÇÕES -->
        <div id="lista-contas" class="space-y-6"></div>
    </div>

    <script>
        const parametrosUrl = new URLSearchParams(window.location.search);
        const itemId = parametrosUrl.get('item');
        const clienteId = parametrosUrl.get('cliente');

        const statusBox = document.getElementById('status-box');
        const listaContas = document.getElementById('lista-contas');
        const cardsResumo = document.getElementById('cards-resumo');

        if (clienteId) {
            document.getElementById('info-cliente').innerText = `Atendimento: #${MC_CONFIG.escapeHtml(clienteId)}`;
        }

        async function buscarDados() {
            if (!itemId) {
                mostrarErro("Nenhum código de conexão (Item ID) foi fornecido na URL.");
                return;
            }

            try {
                const resposta = await MC_CONFIG.authFetch(`/consultar-dados/${itemId}`);
                
                if (!resposta.ok) {
                    throw new Error('Falha ao consultar API bancária da Pluggy.');
                }

                const dados = await resposta.json();
                renderizarContas(dados);

            } catch (erro) {
                mostrarErro(erro.message || "Erro ao consultar contas bancárias.");
            }
        }

        function renderizarContas(dados) {
            statusBox.style.display = 'none'; 
            const item = dados.item || {};
            const contas = dados.results || [];
            const bancoNome = MC_CONFIG.escapeHtml(item.connector?.name || 'Instituição Bancária');

            // CASO 1: Erro de login ou autorização revogada no banco
            if (item.status === 'LOGIN_ERROR' || (contas.length === 0 && item.error)) {
                const motivo = item.error?.providerMessage || item.error?.message || 'A autorização expirou ou foi revogada no aplicativo do banco.';
                listaContas.innerHTML = `
                    <div class="bg-amber-50/90 border border-amber-200 rounded-3xl p-6 md:p-8 text-amber-900 shadow-sm">
                        <div class="flex items-start gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl flex-shrink-0">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <div class="flex-1">
                                <h3 class="font-bold text-base text-[#010157]">Autorização Expirada ou Revogada no Banco</h3>
                                <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                                    Instituição: <strong>${bancoNome}</strong><br>
                                    Diagnóstico Técnico: <span class="font-mono text-[11px]">${MC_CONFIG.escapeHtml(motivo)}</span>
                                </p>
                                <div class="mt-4 pt-4 border-t border-amber-200/60 flex flex-wrap gap-3">
                                    <a href="gestor.html" class="bg-[#010157] text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-[#080868] transition">
                                        Gerar Novo Link para o Cliente
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // CASO 2: Nenhuma conta encontrada
            if (contas.length === 0) {
                listaContas.innerHTML = `
                    <div class="bg-white rounded-3xl border border-slate-200/80 p-12 text-center text-xs text-slate-500 shadow-sm">
                        <i class="fa-solid fa-building-columns text-3xl text-slate-300 mb-2 block"></i>
                        Nenhuma conta bancária ativa encontrada para esta conexão no banco <strong>${bancoNome}</strong>.
                    </div>
                `;
                return;
            }

            // Renderiza Cards de Resumo Financeiro
            let saldoTotalGeral = 0;
            contas.forEach(c => {
                if (!isNaN(c.balance)) saldoTotalGeral += Number(c.balance);
            });

            cardsResumo.classList.remove('hidden');
            cardsResumo.innerHTML = `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Saldo Total Disponível</span>
                    <strong class="text-xl font-extrabold text-[#0985ff]">${MC_CONFIG.formatMoney(saldoTotalGeral)}</strong>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Contas Conectadas</span>
                    <strong class="text-xl font-extrabold text-[#010157]">${contas.length}</strong>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Instituição Bancária</span>
                    <strong class="text-base font-bold text-slate-700 truncate block">${bancoNome}</strong>
                </div>
            `;

            listaContas.innerHTML = ''; 

            contas.forEach(conta => {
                const saldoFormatado = MC_CONFIG.formatMoney(conta.balance);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl border border-slate-200/80 p-6 md:p-8 shadow-sm space-y-5';
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-4 border-b border-slate-100">
                        <div>
                            <h3 class="font-bold text-[#010157] text-base mb-1">${MC_CONFIG.escapeHtml(conta.name || 'Conta Bancária')}</h3>
                            <p class="text-xs text-slate-500">
                                Agência: <span class="font-mono">${MC_CONFIG.escapeHtml(conta.agency || '---')}</span> | 
                                Conta: <span class="font-mono">${MC_CONFIG.escapeHtml(conta.number || '---')}</span> | 
                                <span class="text-[#0985ff] font-semibold uppercase">${MC_CONFIG.escapeHtml(conta.subtype || 'Corrente')}</span>
                            </p>
                        </div>
                        <div class="text-left sm:text-right">
                            <span class="text-[10px] text-slate-400 uppercase font-bold block mb-0.5">Saldo Disponível</span>
                            <strong class="text-[#0985ff] font-extrabold text-2xl">${saldoFormatado}</strong>
                        </div>
                    </div>

                    <!-- Área de Transações da Conta -->
                    <div id="transacoes-container-${conta.id}" class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-[#010157] uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-list-check text-[#0985ff]"></i> Movimentações Recentes
                            </span>
                            <span id="badge-tx-qtd-${conta.id}" class="text-[10px] bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full font-bold">
                                Carregando...
                            </span>
                        </div>
                        <div id="transacoes-lista-${conta.id}" class="bg-slate-50 rounded-2xl p-4 border border-slate-200/80 text-center text-xs text-slate-400">
                            <i class="fa-solid fa-circle-notch fa-spin text-[#0985ff] mr-1.5"></i> Buscando histórico no extrato bancário...
                        </div>
                    </div>
                `;
                listaContas.appendChild(card);

                // Dispara busca das transações da conta
                buscarTransacoesConta(conta.id);
            });
        }

        async function buscarTransacoesConta(accountId) {
            const listaDiv = document.getElementById(`transacoes-lista-${accountId}`);
            const badgeQtd = document.getElementById(`badge-tx-qtd-${accountId}`);

            try {
                const resposta = await MC_CONFIG.authFetch(`/consultar-transacoes/${accountId}`);
                const payload = await resposta.json();

                if (!resposta.ok) throw new Error(payload.erro || 'Falha ao consultar transações');

                const transacoes = payload.results || payload.data || [];

                if (transacoes.length === 0) {
                    badgeQtd.textContent = '0 movimentações';
                    listaDiv.innerHTML = '<p class="py-2 text-slate-400">Nenhuma movimentação registrada no período recente.</p>';
                    return;
                }

                badgeQtd.textContent = `${transacoes.length} transações`;
                let htmlTx = '<div class="space-y-1.5 max-h-72 overflow-y-auto pr-1 custom-scrollbar text-left">';

                transacoes.forEach(tx => {
                    if (tx.amount == null) return;

                    const valorFormatado = MC_CONFIG.formatMoney(Math.abs(tx.amount));
                    const isNegativo = tx.amount < 0;
                    const corValor = isNegativo ? 'text-slate-800' : 'text-[#0985ff] font-bold';
                    const sinal = isNegativo ? '-' : '+';
                    const dataFormatada = tx.date ? new Date(tx.date).toLocaleDateString('pt-BR') : '---';
                    const descricao = MC_CONFIG.escapeHtml(tx.description || 'Transação');

                    htmlTx += `
                        <div class="flex justify-between items-center text-xs py-2 px-3 bg-white rounded-xl border border-slate-100 hover:border-slate-200 transition">
                            <span class="text-slate-700 truncate max-w-xs md:max-w-lg">
                                <span class="text-slate-400 font-mono text-[11px] mr-2">${dataFormatada}</span>
                                ${descricao}
                            </span>
                            <span class="${corValor} font-mono whitespace-nowrap ml-2">${sinal} ${valorFormatado}</span>
                        </div>
                    `;
                });

                htmlTx += '</div>';
                listaDiv.innerHTML = htmlTx;

            } catch (e) {
                badgeQtd.textContent = 'Erro';
                listaDiv.innerHTML = `<p class="py-2 text-rose-500">Erro ao carregar movimentações: ${MC_CONFIG.escapeHtml(e.message)}</p>`;
            }
        }

        function mostrarErro(mensagem) {
            statusBox.className = 'bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold p-4 rounded-xl flex items-center justify-center gap-2';
            statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${MC_CONFIG.escapeHtml(mensagem)}`;
        }

        window.onload = () => {
            buscarDados();
        };
    </script>
</body>
</html>
