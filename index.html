<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Minha Conta - Portal Oficial Open Finance & Pix Automático</title>
    
    <!-- Configuração Central e Segurança -->
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .bg-brand {
            background-color: #010157;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(9, 133, 255, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(9, 133, 255, 0.18) 0%, transparent 45%),
                linear-gradient(to bottom, #010157, #050538);
        }
        .btn-brand {
            background: linear-gradient(135deg, #0985ff 0%, #0772dc 100%);
            box-shadow: 0 10px 25px -5px rgba(9, 133, 255, 0.4);
        }
        .btn-brand:hover {
            background: linear-gradient(135deg, #1aa0ff 0%, #0985ff 100%);
            box-shadow: 0 12px 28px -5px rgba(9, 133, 255, 0.5);
        }
    </style>
</head>
<body class="bg-brand min-h-screen flex items-center justify-center p-4 antialiased text-slate-100">

    <main class="max-w-md w-full bg-[#010157]/80 border border-blue-500/25 rounded-3xl shadow-2xl p-8 md:p-10 text-center relative overflow-hidden backdrop-blur-xl">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#0985ff] via-sky-400 to-[#010157]"></div>

        <div class="bg-white/95 rounded-2xl p-3 inline-block shadow-lg shadow-black/25 mb-5 border border-white/20">
            <img src="logo-mc-minhaconta.png" alt="MC Minha Conta" class="h-20 w-auto object-contain">
        </div>

        <h1 class="text-2xl font-bold text-white tracking-tight mb-2">MC Securitizadora</h1>
        <p class="text-blue-200/80 text-xs mb-8 leading-relaxed">
            Plataforma Corporativa de Integração com Open Finance e Cobrança Recorrente Pix Automático.
        </p>

        <div class="space-y-3.5">
            <a 
                href="gestor-login.html" 
                class="btn-brand w-full text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-2.5 text-xs tracking-wide cursor-pointer"
            >
                <i class="fa-solid fa-lock text-sm"></i> Acessar Portal do Gestor
            </a>

            <a 
                href="cliente.html?cliente=Demonstracao" 
                class="w-full bg-[#050538] hover:bg-[#0a0a52] text-white font-semibold py-3.5 px-6 rounded-xl border border-blue-500/30 transition duration-200 flex items-center justify-center gap-2.5 text-xs tracking-wide cursor-pointer"
            >
                <i class="fa-solid fa-user-check text-sm text-[#0985ff]"></i> Simular Conexão do Cliente
            </a>
        </div>

        <footer class="mt-8 pt-6 border-t border-blue-500/20 flex items-center justify-center gap-2 text-[10px] text-blue-300/70 uppercase tracking-widest font-semibold">
            <i class="fa-solid fa-shield-halved text-[#0985ff]"></i> Infraestrutura Bancária Certificada
        </footer>
    </main>

</body>
</html>
